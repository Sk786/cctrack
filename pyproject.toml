[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cctrack-ai"
version = "0.2.0"
description = "Track and analyze AI token usage from Claude Code and other CLI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["claude", "ai", "token", "usage", "cli", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "plotext>=5.2",
]

[project.urls]
Homepage = "https://github.com/Sk786/cctrack"
"Bug Tracker" = "https://github.com/Sk786/cctrack/issues"

[project.scripts]
cctrack = "cctrack.main:app"
cctrack-prompt = "cctrack.prompt_cmd:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "twine>=5.0",
    "build>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["cctrack"]

[tool.hatch.build.targets.sdist]
include = [
    "cctrack/",
    "README.md",
    "pyproject.toml",
]
