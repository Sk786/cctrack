name: CI / CD

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether this version is already published
        id: version
        run: |
          VERSION=$(python -c "import pathlib,tomllib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -fsS "https://pypi.org/pypi/cctrack-ai/$VERSION/json" > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "cctrack-ai $VERSION is already on PyPI — skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        if: steps.version.outputs.publish == 'true'
        run: pip install build twine

      - name: Build package
        if: steps.version.outputs.publish == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.version.outputs.publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --verbose dist/*
